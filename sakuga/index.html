<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakuga — Indie Anime</title>
<link rel="icon" type="image/png" href="../favicon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #eef1f5;
    --surface:   #ffffff;
    --surface-2: #e4e9ef;
    --ink:       #0b0d10;
    --ink-soft:  #545c68;
    --ink-mute:  #8b94a1;
    --line:      #d3d9e0;
    --accent:    #1673e6;
    --radius:    14px;
    --radius-sm: 7px;
    --display: 'Archivo Black', system-ui, sans-serif;
    --body:    'Archivo', system-ui, sans-serif;
    --mono:    'JetBrains Mono', monospace;
  }
  body.dark {
    --bg:        #0c0e12;
    --surface:   #14181e;
    --surface-2: #1b212a;
    --ink:       #f2f5f8;
    --ink-soft:  #a4aeba;
    --ink-mute:  #6b7683;
    --line:      #262d38;
    --accent:    #3b93ff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- nav ---------- */
  .nav {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 28px; background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 40;
  }
  .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
    color: #fff; font-family: var(--display); font-size: 19px;
    display: grid; place-items: center;
  }
  .brand-name { font-family: var(--display); font-size: 25px; letter-spacing: -.02em; }
  .brand-name em { font-style: normal; color: var(--accent); }
  .nav-link { font-weight: 600; font-size: 15px; color: var(--ink); }
  .nav-link:hover { color: var(--accent); }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 17px; padding: 4px 6px; line-height: 1;
  }
  .btn {
    font-family: var(--body); font-weight: 700; font-size: 14px;
    padding: 10px 22px; border-radius: 9px; cursor: pointer;
    border: 1px solid transparent; background: var(--accent); color: #fff;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn-ghost {
    background: transparent; color: var(--ink); border-color: var(--line);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); filter: none; }

  /* ---------- hero ---------- */
  .hero {
    position: relative; min-height: 460px;
    display: flex; align-items: center;
    padding: 56px 28px; overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    filter: saturate(.85);
  }
  .hero-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(100deg, var(--bg) 0%, var(--bg) 26%, transparent 78%);
  }
  .hero-inner { position: relative; z-index: 1; max-width: 620px; }
  .kicker {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--accent);
  }
  .kicker::before { content: ''; width: 30px; height: 2px; background: var(--accent); }
  .hero h1 {
    font-family: var(--display); font-size: clamp(38px, 6.5vw, 76px);
    line-height: .96; letter-spacing: -.03em; margin: 0 0 20px;
  }
  .hero p {
    font-size: 16px; line-height: 1.65; color: var(--ink-soft);
    margin: 0 0 26px; max-width: 460px;
  }
  .hero-actions { display: flex; gap: 11px; flex-wrap: wrap; }

  /* ---------- filters ---------- */
  .filters {
    display: flex; gap: 12px; padding: 0 28px; margin: -26px auto 34px;
    max-width: 1400px; position: relative; z-index: 5; flex-wrap: wrap;
  }
  .search-wrap { flex: 1; min-width: 240px; position: relative; }
  .search-wrap svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--ink-mute); pointer-events: none;
  }
  .search-wrap input {
    width: 100%; padding: 15px 16px 15px 46px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    font-family: var(--body); font-size: 15px;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); }
  #tagFilter {
    padding: 15px 18px; min-width: 176px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    font-family: var(--body); font-size: 15px; cursor: pointer;
  }
  #tagFilter:focus { outline: none; border-color: var(--accent); }

  /* ---------- grid ---------- */
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 28px 90px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 18px; gap: 14px;
  }
  .section-head h2 {
    font-family: var(--display); font-size: 21px; letter-spacing: -.01em; margin: 0;
  }
  .count { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); }

  .grid {
    display: grid; gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
  }
  .card { cursor: pointer; }
  .card-thumb {
    position: relative; aspect-ratio: 16/10; border-radius: var(--radius);
    overflow: hidden; background: var(--surface-2); margin-bottom: 11px;
    border: 1px solid var(--line);
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb .ph {
    width: 100%; height: 100%; display: grid; place-items: center;
    font-family: var(--display); font-size: 34px; color: var(--ink-mute);
  }
  .card-play {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(6,10,16,.42); opacity: 0; transition: opacity .16s;
    color: #fff; font-size: 30px;
  }
  .card:hover .card-play { opacity: 1; }
  .card-runtime {
    position: absolute; right: 9px; bottom: 9px;
    background: rgba(6,10,16,.82); color: #fff;
    font-family: var(--mono); font-size: 11px;
    padding: 3px 7px; border-radius: 4px;
  }
  .card h3 {
    font-size: 15px; font-weight: 700; margin: 0 0 4px; line-height: 1.3;
  }
  .card .by { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: .05em;
    padding: 3px 8px; border-radius: 20px;
    background: var(--surface-2); color: var(--ink-soft);
  }

  .empty {
    padding: 72px 20px; text-align: center; color: var(--ink-mute);
    font-size: 15px; grid-column: 1 / -1;
  }
  .empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 7px; }

  /* ---------- player ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 90; display: none;
    background: rgba(4,7,11,.9); padding: 34px;
    overflow-y: auto;
  }
  .modal.open { display: block; }
  .modal-box {
    max-width: 940px; margin: 0 auto; background: var(--surface);
    border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--line);
  }
  .modal-box video { width: 100%; display: block; background: #000; max-height: 74vh; }
  .modal-info { padding: 22px 24px 26px; }
  .modal-info h2 { font-family: var(--display); font-size: 24px; margin: 0 0 6px; letter-spacing: -.01em; }
  .modal-info .by { color: var(--ink-soft); font-size: 14px; margin-bottom: 14px; }
  .modal-info p { color: var(--ink-soft); font-size: 15px; line-height: 1.65; margin: 0 0 16px; }
  .modal-close {
    position: fixed; top: 22px; right: 26px; z-index: 91;
    background: rgba(255,255,255,.12); color: #fff; border: none;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 19px;
  }
  .modal-close:hover { background: rgba(255,255,255,.24); }

  @media (max-width: 700px) {
    .nav { padding: 12px 16px; gap: 12px; }
    .brand-name { font-size: 21px; }
    .nav-link { display: none; }
    .hero { min-height: 340px; padding: 40px 16px; }
    .hero-bg::after { background: linear-gradient(180deg, transparent 0%, var(--bg) 82%); }
    .filters, .wrap { padding-left: 16px; padding-right: 16px; }
    .modal { padding: 0; }
    .modal-box { border-radius: 0; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">
    <span class="brand-mark">S</span>
    <span class="brand-name">Sak<em>uga</em></span>
  </a>
  <a class="nav-link" href="index.html">Browse</a>
  <a class="nav-link" href="../submit.html">My Works</a>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">🌙</button>
  <a class="btn" href="../submit.html">Submit</a>
</nav>

<header class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-inner">
    <div class="kicker" id="heroKicker">Featured Work</div>
    <h1 id="heroTitle">Discover<br>Indie Anime</h1>
    <p id="heroDesc">A curated archive of original anime, indie animation, and creator-owned shorts. Every work reviewed before it goes live.</p>
    <div class="hero-actions">
      <button class="btn btn-ghost" id="heroWatch" type="button" hidden>▶ Watch Now</button>
      <a class="btn btn-ghost" href="../submit.html">Submit Yours</a>
    </div>
  </div>
</header>

<div class="filters">
  <div class="search-wrap">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input type="search" id="search" placeholder="Search titles, creators, tags…" autocomplete="off">
  </div>
  <select id="tagFilter"><option value="">All tags</option></select>
</div>

<main class="wrap">
  <div class="section-head">
    <h2 id="sectionTitle">All Works</h2>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid">
    <div class="empty">Loading…</div>
  </div>
</main>

<div class="modal" id="modal">
  <button class="modal-close" id="modalClose" type="button">✕</button>
  <div class="modal-box">
    <video id="player" controls playsinline controlsList="nodownload"></video>
    <div class="modal-info">
      <h2 id="mTitle"></h2>
      <div class="by" id="mBy"></div>
      <p id="mDesc"></p>
      <div class="tags" id="mTags"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://eosnuxttjchckprpymnw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_QSDQxkMRbxn1M4m5L5sB6w_auxSAZVg';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));

  // ---- theme ----
  const themeBtn = document.getElementById('themeBtn');
  if (localStorage.getItem('sakuga-theme') === 'dark') document.body.classList.add('dark');
  themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  themeBtn.addEventListener('click', () => {
    const dark = !document.body.classList.contains('dark');
    document.body.classList.toggle('dark', dark);
    localStorage.setItem('sakuga-theme', dark ? 'dark' : 'light');
    themeBtn.textContent = dark ? '☀️' : '🌙';
  });

  let works = [];

  function runtime(secs) {
    if (!secs) return '';
    const m = Math.floor(secs / 60), s = secs % 60;
    return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `0:${String(s).padStart(2,'0')}`;
  }

  function tagsOf(w) {
    const t = w.meta && w.meta.tags;
    return Array.isArray(t) ? t : [];
  }

  function cardHtml(w, i) {
    const tags = tagsOf(w).slice(0, 3);
    const rt   = runtime(w.meta && w.meta.runtime);
    return `
      <article class="card" data-i="${i}">
        <div class="card-thumb">
          ${w.cover_url
            ? `<img src="${esc(w.cover_url)}" alt="" loading="lazy">`
            : `<div class="ph">${esc((w.title || '?').charAt(0).toUpperCase())}</div>`}
          <div class="card-play">▶</div>
          ${rt ? `<span class="card-runtime">${esc(rt)}</span>` : ''}
        </div>
        <h3>${esc(w.title || 'Untitled')}</h3>
        <div class="by">${esc((w.meta && w.meta.creator) || 'Unknown creator')}</div>
        <div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      </article>`;
  }

  function render() {
    const q   = document.getElementById('search').value.trim().toLowerCase();
    const tag = document.getElementById('tagFilter').value;

    const shown = works.filter(w => {
      if (tag && !tagsOf(w).includes(tag)) return false;
      if (!q) return true;
      const hay = [
        w.title || '',
        (w.meta && w.meta.creator) || '',
        tagsOf(w).join(' ')
      ].join(' ').toLowerCase();
      return hay.includes(q);
    });

    document.getElementById('count').textContent =
      shown.length + (shown.length === 1 ? ' work' : ' works');

    const grid = document.getElementById('grid');
    if (!shown.length) {
      grid.innerHTML = works.length
        ? `<div class="empty"><strong>Nothing matches that</strong>Try a different search or clear the tag filter.</div>`
        : `<div class="empty"><strong>Nothing here yet</strong>Be the first to submit something.</div>`;
      return;
    }
    grid.innerHTML = shown.map((w) => cardHtml(w, works.indexOf(w))).join('');
    grid.querySelectorAll('.card').forEach(c => {
      c.addEventListener('click', () => open(works[+c.dataset.i]));
    });
  }

  // ---- player ----
  const modal  = document.getElementById('modal');
  const player = document.getElementById('player');

  function open(w) {
    if (!w) return;
    document.getElementById('mTitle').textContent = w.title || 'Untitled';
    document.getElementById('mBy').textContent =
      'by ' + ((w.meta && w.meta.creator) || 'Unknown creator');
    const d = (w.meta && w.meta.description) || '';
    document.getElementById('mDesc').textContent = d;
    document.getElementById('mDesc').hidden = !d;
    document.getElementById('mTags').innerHTML =
      tagsOf(w).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    player.src = w.download_url;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    player.play().catch(() => {});
  }

  function close() {
    modal.classList.remove('open');
    player.pause();
    player.removeAttribute('src');
    player.load();
    document.body.style.overflow = '';
  }

  document.getElementById('modalClose').addEventListener('click', close);
  modal.addEventListener('mousedown', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) close();
  });

  // ---- hero ----
  function setHero(w) {
    if (!w) return;
    document.getElementById('heroKicker').textContent = 'Featured Work';
    document.getElementById('heroTitle').textContent = w.title || 'Untitled';
    document.getElementById('heroDesc').textContent =
      (w.meta && w.meta.description) ||
      'A curated archive of original anime, indie animation, and creator-owned shorts.';
    if (w.cover_url) {
      document.getElementById('heroBg').style.backgroundImage = `url('${w.cover_url}')`;
    }
    const btn = document.getElementById('heroWatch');
    btn.hidden = false;
    btn.addEventListener('click', () => open(w));
  }

  // ---- load ----
  (async function init() {
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('tagFilter').addEventListener('change', render);

    // tag vocabulary
    try {
      const { data } = await sb.from('site_settings').select('value')
        .eq('key', 'sakuga_tags').maybeSingle();
      if (Array.isArray(data?.value)) {
        const sel = document.getElementById('tagFilter');
        data.value.forEach(t => {
          const o = document.createElement('option');
          o.value = t; o.textContent = t;
          sel.appendChild(o);
        });
      }
    } catch (e) { console.warn('[Sakuga] tags:', e.message); }

    // published works
    try {
      const { data, error } = await sb.from('videos').select('*')
        .eq('category', 'Original')
        .or('void.eq.false,void.is.null')
        .order('date_added', { ascending: false });
      if (error) throw error;
      works = data || [];
      render();
    } catch (e) {
      document.getElementById('grid').innerHTML =
        `<div class="empty"><strong>Could not load</strong>${esc(e.message || '')}</div>`;
      return;
    }

    // featured, falling back to the newest
    try {
      const { data } = await sb.from('site_settings').select('value')
        .eq('key', 'sakuga_featured').maybeSingle();
      const id = data?.value;
      const pick = (id != null && works.find(w => String(w.id) === String(id))) || works[0];
      setHero(pick);
    } catch (e) {
      setHero(works[0]);
    }
  })();
})();
</script>
</body>
</html>
