<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Originals — Onyx</title>
<link rel="icon" type="image/png" href="../favicon-256.png">
<link rel="apple-touch-icon" href="../favicon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Onyx's stylesheet. Everything below reuses its classes and tokens
     so this page stays in step with the rest of the site. -->
<link rel="stylesheet" href="../styles.css">

<style>
  /* Only the few things styles.css has no class for. */

  .work-by {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--ink-mute);
    margin-top: 2px;
  }

  .sakuga-tagline {
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 20px;
    max-width: 60ch;
  }

  .player-dialog {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0;
    width: min(940px, 94vw);
    max-width: 94vw;
  }
  .player-dialog::backdrop {
    background: rgba(0,0,0,0.84);
    backdrop-filter: blur(6px);
  }
  .player-dialog video {
    width: 100%;
    display: block;
    background: #000;
    max-height: 72vh;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .player-dialog-info { padding: 20px 24px 24px; position: relative; }
  .player-dialog-info h2 {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .player-dialog-info .by {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin-bottom: 12px;
  }
  .player-dialog-info p {
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
</style>
</head>
<body>
<a class="skip-link" href="#worksGrid">Skip to main content</a>

<nav class="topnav">
  <a class="topnav-brand" href="../index.html" aria-label="Onyx home">
    <svg viewBox="0 0 110 38" height="28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <text x="55" y="24" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="900" letter-spacing="6" fill="currentColor">ONYX</text>
      <line x1="8" y1="29" x2="102" y2="29" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="55" y="38" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="7" font-weight="400" letter-spacing="4" fill="#A0AABF">ORIGINALS</text>
    </svg>
  </a>
  <div class="topnav-search">
    <span class="topnav-search-icon">⌕</span>
    <input id="search" type="search" aria-label="Search works" placeholder="Search titles, creators, tags…" autocomplete="off">
  </div>
  <div class="topnav-right">
    <a href="../index.html" class="btn btn-outline btn-small">Back to Onyx</a>
    <a href="../submit.html" class="btn btn-solid btn-small">Submit</a>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">☾</button>
  </div>
</nav>

<div class="page">

  <section id="heroSlideshow" class="hero-slideshow" aria-label="Featured work" hidden>
    <div class="hero-slides">
      <div class="hero-slide">
        <div class="hero-slide-bg" id="heroBg"></div>
        <div class="hero-slide-gradient"></div>
        <div class="hero-slide-content">
          <img class="hero-slide-poster" id="heroPoster" alt="" hidden>
          <div class="hero-slide-info">
            <div class="hero-slide-cat">Featured Work</div>
            <h1 class="hero-slide-title" id="heroTitle"></h1>
            <p class="hero-slide-desc" id="heroDesc"></p>
            <div class="hero-slide-actions">
              <button class="hero-slide-link" id="heroWatch" type="button">▶ Watch Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section style="padding-top:28px">
    <h1 class="detail-title" style="font-size:clamp(24px,3.2vw,38px);margin-bottom:10px">Onyx Originals</h1>
    <p class="sakuga-tagline">
      Original animation, indie shorts and creator-owned work. Everything here
      was made by the person who sent it in, and watched by a human before it
      went up.
    </p>
  </section>

  <div class="genre-filters-wrap">
    <span class="genre-filters-label">Tags</span>
    <div class="genre-filters-bar" id="tagFilters" aria-label="Tag filters"></div>
  </div>

  <p class="status-line"><span id="count">Loading…</span></p>

  <main class="collections" aria-label="Original works">
    <div class="poster-grid" id="worksGrid"></div>
  </main>

  <footer class="site-foot">
    <span id="year"></span>
    <span>Onyx Originals</span>
  </footer>

</div>

<dialog id="playerDialog" class="player-dialog">
  <video id="player" controls playsinline controlsList="nodownload noremoteplayback"></video>
  <div class="player-dialog-info">
    <button class="dialog-close" id="playerClose" type="button" aria-label="Close">✕</button>
    <h2 id="mTitle"></h2>
    <div class="by" id="mBy"></div>
    <p id="mDesc"></p>
    <div class="tag-list" id="mTags"></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../core.js"></script>
<script>
(function () {
  // core.js gives us getSupabase, escapeHtml and the theme key, so this
  // page does not repeat any of it.

  const sb = getSupabase();
  document.body.classList.toggle('light', localStorage.getItem('aurum-theme') === 'light');

  const yearEl = document.getElementById('year');
  if (yearEl) yearEl.textContent = '© ' + new Date().getFullYear();

  const tt = document.getElementById('themeToggle');
  tt.textContent = document.body.classList.contains('light') ? '☀' : '☾';
  tt.addEventListener('click', () => {
    const nowLight = !document.body.classList.contains('light');
    document.body.classList.toggle('light', nowLight);
    localStorage.setItem('aurum-theme', nowLight ? 'light' : 'dark');
    tt.textContent = nowLight ? '☀' : '☾';
  });

  let works = [];
  let activeTag = '';

  const runtime = s => {
    if (!s) return '';
    const m = Math.floor(s / 60), sec = s % 60;
    return m > 0 ? `${m}:${String(sec).padStart(2, '0')}` : `0:${String(sec).padStart(2, '0')}`;
  };

  const tagsOf = w => (w.meta && Array.isArray(w.meta.tags)) ? w.meta.tags : [];

  function cardHtml(w, i) {
    const creator = (w.meta && w.meta.creator) || '';
    const rt = runtime(w.meta && w.meta.runtime);
    return `
      <article class="poster-card">
        <a class="poster-clickable" href="#" data-i="${i}">
          <div class="poster-cover">
            ${w.cover_url
              ? `<img src="${escapeHtml(w.cover_url)}" alt="" loading="lazy">`
              : `<div class="cover-placeholder">${escapeHtml((w.title || '?').charAt(0).toUpperCase())}</div>`}
            <div class="poster-overlay"><span class="poster-play-icon">&#9654;</span></div>
            ${rt ? `<span class="poster-ep-badge">${escapeHtml(rt)}</span>` : ''}
          </div>
          <div class="poster-info">
            <div class="poster-cat">ORIGINAL</div>
            <h3 class="poster-title">${escapeHtml(w.title || 'Untitled')}</h3>
            ${creator ? `<div class="work-by">${escapeHtml(creator)}</div>` : ''}
          </div>
        </a>
      </article>`;
  }

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();

    const shown = works.filter(w => {
      if (activeTag && !tagsOf(w).includes(activeTag)) return false;
      if (!q) return true;
      const hay = [w.title || '', (w.meta && w.meta.creator) || '', tagsOf(w).join(' ')]
        .join(' ').toLowerCase();
      return hay.includes(q);
    });

    document.getElementById('count').textContent =
      works.length
        ? `${shown.length} ${shown.length === 1 ? 'work' : 'works'}`
        : 'Nothing published yet';

    const grid = document.getElementById('worksGrid');
    if (!shown.length) {
      grid.className = '';
      grid.innerHTML = works.length
        ? `<div class="empty">Nothing matches that. Try a different search or clear the tag.</div>`
        : `<div class="empty">Nothing here yet. If you make animation, this is where it goes —
             <a href="../submit.html" style="color:var(--accent)">send it in</a>.</div>`;
      return;
    }
    grid.className = 'poster-grid';
    grid.innerHTML = shown.map(w => cardHtml(w, works.indexOf(w))).join('');
    grid.querySelectorAll('.poster-clickable').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); open(works[+a.dataset.i]); });
    });
  }

  // ---- player ----
  const dialog = document.getElementById('playerDialog');
  const player = document.getElementById('player');

  function open(w) {
    if (!w) return;
    document.getElementById('mTitle').textContent = w.title || 'Untitled';
    document.getElementById('mBy').textContent =
      'by ' + ((w.meta && w.meta.creator) || 'unknown creator');
    const d = (w.meta && w.meta.description) || '';
    const dEl = document.getElementById('mDesc');
    dEl.textContent = d;
    dEl.hidden = !d;
    document.getElementById('mTags').innerHTML =
      tagsOf(w).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
    player.src = w.download_url;
    dialog.showModal();
    player.play().catch(() => {});
  }

  function close() {
    player.pause();
    player.removeAttribute('src');
    player.load();
    dialog.close();
  }

  document.getElementById('playerClose').addEventListener('click', close);
  dialog.addEventListener('close', () => { player.pause(); });
  dialog.addEventListener('click', e => { if (e.target === dialog) close(); });

  // ---- hero ----
  function setHero(w) {
    if (!w) return;
    const hero = document.getElementById('heroSlideshow');
    document.getElementById('heroTitle').textContent = w.title || 'Untitled';
    document.getElementById('heroDesc').textContent =
      (w.meta && w.meta.description) || '';
    if (w.cover_url) {
      document.getElementById('heroBg').style.backgroundImage = `url('${w.cover_url}')`;
      const p = document.getElementById('heroPoster');
      p.src = w.cover_url;
      p.hidden = false;
    }
    document.getElementById('heroWatch').addEventListener('click', () => open(w));
    hero.hidden = false;
  }

  // ---- load ----
  (async function init() {
    document.getElementById('search').addEventListener('input', render);

    // Tag vocabulary, editable in site_settings without a deploy.
    try {
      const { data } = await sb.from('site_settings').select('value')
        .eq('key', 'sakuga_tags').maybeSingle();
      if (Array.isArray(data?.value)) {
        const bar = document.getElementById('tagFilters');
        const mk = (label, val) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'genre-chip' + (val === '' ? ' active' : '');
          b.textContent = label;
          b.addEventListener('click', () => {
            activeTag = val;
            bar.querySelectorAll('.genre-chip').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            render();
          });
          return b;
        };
        bar.appendChild(mk('All', ''));
        data.value.forEach(t => bar.appendChild(mk(t, t)));
      }
    } catch (e) { console.warn('[Originals] tags:', e.message); }

    // Published works.
    try {
      const { data, error } = await sb.from('videos').select('*')
        .eq('category', 'Original')
        .or('void.eq.false,void.is.null')
        .order('date_added', { ascending: false });
      if (error) throw error;
      works = data || [];
    } catch (e) {
      document.getElementById('count').textContent = 'Could not load: ' + (e.message || '');
      return;
    }

    render();

    // Featured, falling back to the newest.
    try {
      const { data } = await sb.from('site_settings').select('value')
        .eq('key', 'sakuga_featured').maybeSingle();
      const id = data?.value;
      const pick = (id != null && works.find(w => String(w.id) === String(id))) || works[0];
      setHero(pick);
    } catch (e) {
      setHero(works[0]);
    }
  })();
})();
</script>
</body>
</html>
